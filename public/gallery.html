<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapTag - Gallery</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <
    <header class="site-header">
      <a class="brand" href="index.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
          />
          <line x1="7" y1="7" x2="7.01" y2="7" />
        </svg>
        <span>SnapTag</span>
      </a>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h1>Gallery</h1>
        <p>Browse your photos by what's in them.</p>
      </section>

      <section class="toolbar" aria-label="Search and filter">
        <div class="search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <label class="sr-only" for="search">Search photos by tag</label>
          <input
            id="search"
            type="search"
            placeholder="Search by tag, like dog or beach"
            autocomplete="off"
          />
        </div>
        <div
          id="chips"
          class="chips"
          role="group"
          aria-label="Filter by tag"
        ></div>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section id="grid" class="grid" aria-label="Photos"></section>
    </main>

    <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
      <button
        id="viewer-close"
        class="viewer-close"
        type="button"
        aria-label="Close photo"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <img id="viewer-img" src="" alt="" />
      <div class="viewer-body">
        <h2 id="viewer-title"></h2>
        <ul id="viewer-tags" class="tags"></ul>
      </div>
    </dialog>
  </body>
</html>
