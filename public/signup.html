<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapTag - Signup</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <script src="scripts/navbar.js"></script>

    <main class="auth">
      <section class="auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Create your account</h1>
        <p class="auth-sub">Start uploading photos and let SnapTag tag them.</p>

        <form class="auth-form" data-auth-form>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <small>At least 8 characters.</small>
          </div>
          <button class="btn btn-solid btn-block" type="submit">Sign up</button>
          <p class="auth-status" aria-live="polite" data-auth-status></p>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </section>
    </main>

    <script src="scripts/auth.js"></script>
  </body>
</html>
